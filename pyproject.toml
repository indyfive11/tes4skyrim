[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesconversion"
version = "0.1.0"
description = "TES4 (Oblivion) to TES5 (Skyrim) conversion pipeline"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = ["pytest", "ruff", "vulture"]

[tool.setuptools]
py-modules = ["convert", "gui", "output_layout", "preflight",
              "source_paths", "version"]

[tool.setuptools.packages.find]
include = ["tes4_export*", "tes5_import*", "asset_convert*",
           "script_convert*", "tools*", "core*", "extensions*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
    "E701",  # multiple statements on one line (colon) — used in binary parsers
    "E702",  # multiple statements on one line (semicolon) — used in binary parsers
    "E741",  # ambiguous variable name (we use l, O, I in binary parsing)
]

[tool.ruff.lint.per-file-ignores]
# tes5_import uses re-export pattern that ruff F401 would incorrectly remove
"tes5_import/__init__.py" = ["F401"]
"tes5_import/base/constants.py" = ["F401"]
# Script-style tools are documented as `python tools/<x>.py`, so they insert
# the repo root on sys.path before importing it -- E402 is inherent to that.
"tools/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["tes4_export", "tes5_import", "asset_convert", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
