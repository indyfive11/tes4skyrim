[CharacterSheet]
; 1 = Morrowind's character sheet: its stats window, its level-up screen (each
; Skyrim level-up also raises three Morrowind attributes) and the attributes'
; buffs. 0 = off: every attribute reads 100, Personality reads Speech, and
; Skyrim plays as vanilla.
Enabled=1

; 1 = a skill cannot rise above its governing attribute through use or a
; trainer, as Morrowind's trainers refuse. Books and quest rewards still raise
; it. Only applies with the sheet on.
SkillCap=1

; The key that opens the character sheet from Skyrim's perks menu (the sheet
; opens only there), as a Windows virtual-key code in decimal (67 = C).
; https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
Hotkey=67
